# =============================================================================
#  Board variant: nRF52833 USB dongle (PCA10100) - no bootloader, SWD only.
#
#  An OVERRIDE file, not a second copy of board.toml - see the header of
#  boards\nice-nano-52840.toml for what that means and why.
#
#  Build it with:
#      set BOARD_OVERRIDE=boards\nrf52833-dongle.toml
#      cargo build --release --no-default-features --features nrf52833
#  or just run tools\build-variants.cmd, which does all four boards.
#
#  STATUS: this profile COMPILES (verified), but its MEMORY LAYOUT HAS NOT BEEN
#  VERIFIED ON HARDWARE. Before flashing, read the real numbers off the board:
#
#      nrfutil device list
#      nrfutil device device-info --serial-number <sn>
#      nrfutil device fw-info     --serial-number <sn>
#
#  fw-info prints the bootloader's own view of where the application lives
#  (`imageLocation.address`), which is exactly the number flash_origin must be.
#  Getting it wrong produces an image that flashes fine and never boots.
#
#  Note nRF52833 has half the flash and half the RAM of the nRF52840, so the
#  storage region has to be re-placed, not just shrunk.
# =============================================================================

[chip]
name = "nrf52833"

[memory]
# This board has no bootloader (dev board, flashed over its on-board J-Link), so
# the application starts at 0 and runs up to the storage region.
flash_origin = 0x00000000
# 448K, ending at 0x70000 where the storage region starts.
flash_length = "448K"
ram_origin = 0x20000000
ram_length = "128K"

[flash]
# Top of the 512K flash. Nothing else occupies this region on the DK, which is
# why the storage below runs right up to it: with no bootloader there is no
# region to preserve, and re-flashing is a matter of connecting over SWD.
reserved_top = 0x80000

[storage]
# 16 sectors x 4K = 64K, placed between the app region and the top of flash.
# See the note in boards\nice-nano-52833.toml - 2 sectors was too few for
# sequential-storage to GC (every RMK example uses at least 6).
start_addr = 0x70000
num_sectors = 16

# [power] is inherited: reg1 = "keep", as in board.toml.
#
# Two keys this file used to carry are GONE, and that is deliberate:
# `timeslots_per_channel = 4` and `max_tx_attempts = 100`. Neither is read by
# anything - board.toml has no such keys, build.rs generates no constant for
# them, and src/gazell.rs never calls nrf_gzll_set_timeslots_per_channel() or
# nrf_gzll_set_max_tx_attempts(), so the host runs on the library defaults. They
# also contradicted board.toml, whose comment states that timeslots_per_channel
# MUST stay 2: the host rotation has to be 6 x 2 = 12 timeslots, shorter than the
# transmitters' 15-tick out-of-sync dwell, or a half coming back from silence
# sweeps past a listening host. A copy of a config file is where a value like
# that goes to rot; inheriting it makes the contradiction impossible to write.
