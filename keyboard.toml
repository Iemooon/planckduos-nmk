# =============================================================================
#  RMK compile-time behaviour limits.
#
#  THIS IS NOT THE BOARD DESCRIPTION - board.toml is, and it stays the single
#  source of truth for anything about the keyboard itself (matrix, flash/RAM
#  layout, USB IDs, Vial definition, Gazell parameters).
#
#  What this file is: RMK's own build script (rmk-types/build.rs) reads a
#  keyboard.toml-format file from the path in the KEYBOARD_TOML_PATH environment
#  variable - set in .cargo/config.toml, exactly as RMK's own examples do - and
#  turns the numbers below into compile-time constants (COMBO_MAX_NUM,
#  MORSE_MAX_NUM, ...). They are capacities baked into the firmware, not
#  settings read at runtime.
#
#  Leaving the file out is not an error: RMK then silently falls back to its
#  defaults, which are 8 combos and 8 morse entries. That fallback is why these
#  numbers belong here explicitly - "the firmware supports 8 combos" is not
#  something that should be discoverable only by reading RMK's source.
#
#  Cost: these capacities live in the storage area described by board.toml's
#  [storage]. The 16 layers x 48 keys keymap is ~1.5 KB, 32 combos and 32 morse
#  entries a few KB more, so even the smallest profile (24 KB / 6 sectors, the
#  52840 dongle) fits; raise [storage] num_sectors if you raise these much
#  further.
# =============================================================================

[rmk]
# The receiver's debounce window, in milliseconds. It reaches the firmware as
# DEBOUNCE_THRESHOLD, and in this receiver it is NOT a delay on the leading edge:
# src/gazell.rs builds RMK's FastDebouncer, which commits a change on the first
# pass that sees it and then holds that key still for this long.
#
# Why it can be this short - the evidence, read out of the transmitter's own
# configuration rather than assumed. The firmware on the other end of this link is
# the redox-w-keyboard-basic port, file main.c.planck:
#
#   * config\nrf_drv_config.h:52  RTC1_CONFIG_FREQUENCY 1000  - and RTC1 is the
#     instance main.c.planck uses (RTC0 is 8 Hz but RTC0_ENABLED = 0). So one tick
#     is 1 ms, which is what main.c.planck:169 "1000Hz debounce sampling" claims
#     and what INACTIVITY_THRESHOLD 500 /* 0.5sec */ agrees with.
#   * main.c.planck:27  DEBOUNCE 5, applied in handle_send (:145): a changed state
#     resets the counter and is NOT sent; a packet goes out only after the new
#     state has held for 5 consecutive ticks, and then repeats every 5 ticks.
#
# So every packet this receiver can ever see is already a state that survived
# 5 ms of stable sampling at the source. A second window here cannot filter
# anything the transmitter did not; it can only delay a change that has already
# been proven stable. The previous setting was RMK's default of 20 ms
# (#[serde_inline_default(20)]), spent through DefaultDebouncer, which waits the
# whole threshold out before committing - 20 ms on the leading edge of every key,
# of which 15 ms duplicated work already done on the other end of the link.
#
# What 5 still does: a key whose state changes twice inside the window is held
# until the window expires, so contradictory reports cannot become two events.
# Nothing in this link produces such a burst - Gazell packets are CRC-checked and
# the half never puts an unstable state on the air - so treat the value as a floor
# rather than a filter. 0 is legal and makes the lockout a single pass.
#
# One companion change that does NOT apply here: in keypoint-nmk, swapping this
# debouncer out required also making the matrix read indivisible, because a 6-row
# half reaches `RAW` as two u32 stores and a task can catch the pair half-updated.
# This board's halves are 4 rows, which pack into ONE word, so a single
# AtomicU32 store/load is already the whole snapshot - no critical section needed.
debounce_time = 5

# Combos. Vial reads this number from the firmware, so raising it is what makes
# more combo slots appear in Vial's Combo tab.
combo_max_num = 32

# Morse - which is RMK's implementation of the "tap dance" behaviour (the same
# machinery also does tap-hold and home row mods; see RMK's
# docs/configuration/behavior.md). One entry per key that carries a pattern.
morse_max_num = 32
